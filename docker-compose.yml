services:
  redis:
    image: redis:7-alpine
    container_name: pulsepoll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: pulsepoll-api
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
